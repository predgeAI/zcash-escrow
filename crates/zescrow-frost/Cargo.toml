[package]
name = "zescrow-frost"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Thin per-party CLI over the Zcash Foundation's rerandomized FROST (RedPallas) crates for a 2-of-3 escrow"

[dependencies]
# Same crates and pins as ZcashFoundation/frost-tools (frost-client). No cryptography lives in this crate.
reddsa = { git = "https://github.com/ZcashFoundation/reddsa.git", rev = "ed49e9ca0699a6450f6d4a9fe62ff168f5ea1ead", features = ["frost"] }
frost-core = { version = "2.2.0", features = ["serde"] }
frost-rerandomized = "2.1.0"
zcash_address = "0.13.0"
zcash_protocol = "0.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
rand = "0.8.5"
clap = { version = "4.5", features = ["derive"] }
eyre = "0.6"
